<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>About me — João Carreiro</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <script>
    fetch('/whipit/about/', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('Failed to load about page');
        return response.text();
      })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML =
          '<main style="font-family:system-ui;padding:32px;max-width:720px;margin:auto">' +
          '<h1>Page not found</h1>' +
          '<p>This page does not exist, but you can continue here:</p>' +
          '<p><a href="/whipit/about/">About me</a></p>' +
          '</main>';
      });
  </script>
</body>
</html>
