<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Search — Whipit</title><style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#171717;--muted:#67625c;--line:#e5e1d9;--pill:#efede8;--green:#0f7b3a;--orange:#9a5b00;--red:#9a2424}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.42}.top{position:sticky;top:0;z-index:2;background:#f7f7f5e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;padding:13px max(16px,calc((100vw - 1180px)/2));font-weight:900}.top a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.hero{text-align:center;padding:42px 0 20px}.hero h1{font-size:clamp(44px,9vw,92px);letter-spacing:-.075em;line-height:.9;margin:0}.lead{color:var(--muted);font-size:19px;max-width:760px;margin:18px auto}.panel,.card,.source,.stat{background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px #00000008}.panel{border-radius:28px;padding:18px;margin-bottom:18px}.row{display:flex;gap:10px}.row input{flex:1;border:1px solid var(--line);border-radius:18px;padding:15px 16px;font-size:18px}.row button,.intent button{border:0;border-radius:999px;padding:11px 15px;font-weight:900;background:var(--ink);color:white;cursor:pointer}.row button:disabled{opacity:.55;cursor:wait}.hint,.status{color:var(--muted);font-size:13px;margin:10px 0 0}.status.error{color:var(--red);font-weight:800}.intent,.checks,.badges{display:flex;flex-wrap:wrap;gap:8px}.intent{margin-top:14px}.intent button{background:var(--pill);color:var(--ink);border:1px solid var(--line);font-size:15px}.intent button.active{background:var(--ink);color:white}.checks{margin-top:13px;color:#333}.checks label{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.engine-groups{margin-top:15px;display:grid;gap:10px}.engine-group{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px}.engine-group h3{margin:0 0 4px;font-size:16px}.engine-group p{margin:0 0 9px;color:var(--muted);font-size:13px}.engine-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px}.engine-list label{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fafafa}.engine-list input{margin-top:3px}.engine-name{font-weight:850}.engine-desc{display:block;color:var(--muted);font-size:12px;margin-top:2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{border-radius:20px;padding:13px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 390px;gap:18px;align-items:start}h2{font-size:28px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:14px}.card,.source{border-radius:24px;padding:16px;margin-bottom:10px}.card h3{font-size:20px;letter-spacing:-.035em;margin:0 0 6px}.card a,.source a{color:inherit;text-decoration:none}.url{display:block;color:var(--green);font-size:13px;word-break:break-all;margin-bottom:9px}.snippet{color:#333}.badge{border:1px solid var(--line);background:var(--pill);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:850}.slow{background:#fff3dd;color:var(--orange)}.people{background:#ffe8e8;color:var(--red)}.fast,.ok{background:#e9f6ee;color:var(--green)}.fail{background:#ffe8e8;color:var(--red)}.source p{margin:7px 0 9px;color:#333;font-size:13px}.source-head{display:flex;justify-content:space-between;gap:8px}.kind{font-size:12px;color:var(--muted);white-space:nowrap}.empty{border:1px dashed var(--line);border-radius:18px;padding:14px;color:var(--muted);background:#fff}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.row{flex-direction:column}.stats{grid-template-columns:1fr}.hero{text-align:left}.lead{margin-left:0}}
</style></head><body><header class="top"><a href="/whipit/about/">← Whipit</a><span>Super Search</span></header><main class="wrap"><section class="hero"><h1>Super Search</h1><p class="lead">Live search across general, people and vehicle-oriented discovery paths.</p></section><section class="panel"><div class="row"><input id="q" type="search" value="" placeholder="Search the web…"><button id="searchBtn">Search</button></div><p class="hint">Choose the search type first. Recommended engines are selected automatically; you can adjust the checkboxes below.</p><div id="intent" class="intent"></div><div class="checks"><label><input id="hideFailed" type="checkbox"> hide failed engines</label></div><div id="engineGroups" class="engine-groups"></div><p id="status" class="status"></p></section><section id="stats" class="stats"></section><section class="grid"><div><h2>Results</h2><p id="sub" class="sub"></p><div id="results"></div></div><aside><h2>Engines</h2><p class="sub">What each selected engine is useful for.</p><div id="sources"></div></aside></section></main><script>
const API_BASE='https://webhook.gallivanter.biz/super-search-api';
const INTENTS={general:{label:'General',apiMode:'all'},people:{label:'People',apiMode:'people'},plates:{label:'Plates',apiMode:'plates'}};
let C={},R={results:[],sources:[]},intent='general',checkedKeys=new Set(),lastQuery='';
const $=id=>document.getElementById(id);
const byKey=()=>Object.fromEntries((C.sources||[]).map(s=>[s.key,s]));
const hasMode=(s,m)=>(s.modes||[]).includes(m);
const sortByName=xs=>[...xs].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const allSources=()=>sortByName(C.sources||[]);
const peopleSources=()=>allSources().filter(s=>hasMode(s,'people'));
const plateSources=()=>allSources().filter(s=>hasMode(s,'plates'));
const generalSources=()=>allSources().filter(s=>hasMode(s,'all')&&!hasMode(s,'people')&&!hasMode(s,'plates'));
const fastSources=()=>generalSources().filter(s=>hasMode(s,'fast'));
const deepSources=()=>generalSources().filter(s=>hasMode(s,'longtail')&&!hasMode(s,'fast'));
const otherGeneralSources=()=>generalSources().filter(s=>!hasMode(s,'fast')&&!hasMode(s,'longtail'));
function bclass(f){return f.includes('slow')?'badge slow':f.includes('people')?'badge people':f.includes('fast')?'badge fast':'badge'}
function selectedKeys(){return [...checkedKeys]}
function recommendedKeys(which=intent){if(which==='general')return fastSources().map(s=>s.key);if(which==='people')return peopleSources().map(s=>s.key);if(which==='plates')return plateSources().map(s=>s.key);return[]}
function setStatus(msg,isError=false){$('status').textContent=msg||'';$('status').className='status'+(isError?' error':'')}
function maybeSearch(){if($('q').value.trim()&&checkedKeys.size)search();}
function chooseIntent(next){intent=next;R={results:[],sources:[]};checkedKeys=new Set(recommendedKeys(next));render();if(checkedKeys.size)maybeSearch();else if(next==='plates')setStatus('No dedicated plate engines yet. Choose general engines below if you want to search public web mentions.');}
function renderIntent(){let el=$('intent');el.innerHTML='';for(const [k,v] of Object.entries(INTENTS)){let bt=document.createElement('button');bt.textContent=v.label;bt.className=k===intent?'active':'';bt.onclick=()=>chooseIntent(k);el.appendChild(bt)}}
function sourceLabel(s){return `<span class="engine-name">${s.name}</span><span class="engine-desc">${s.description||''}</span>`}
function groupHtml(title,desc,sources,empty='No engines in this group yet.'){let text=desc?`<p>${desc}</p>`:'';if(!sources.length)return `<section class="engine-group"><h3>${title}</h3>${text}<div class="empty">${empty}</div></section>`;return `<section class="engine-group"><h3>${title}</h3>${text}<div class="engine-list">${sources.map(s=>`<label><input type="checkbox" data-source-key="${s.key}" ${checkedKeys.has(s.key)?'checked':''}><span>${sourceLabel(s)}</span></label>`).join('')}</div></section>`}
function groupsForIntent(){if(intent==='general')return[
  ['Recommended','Best default engines for general web searches.',fastSources()],
  ['Deep Search','Slower engines for alternative, older, independent or less obvious results.',deepSources()],
  ['Slower general engines','',otherGeneralSources()]
];if(intent==='people')return[
  ['Recommended people engines','People-focused sources selected automatically for this search type.',peopleSources()],
  ['Optional general engines','Add these manually if you also want wider public web mentions.',generalSources()]
];return[
  ['Recommended plate engines','Dedicated plate/VIN engines will appear here when available.',plateSources(),'No dedicated plate engines yet.'],
  ['Optional general engines','Add these manually to search public web mentions of a plate, VIN or vehicle.',generalSources()]
]}
function renderEngineGroups(){$('engineGroups').innerHTML=groupsForIntent().map(g=>groupHtml(...g)).join('');document.querySelectorAll('[data-source-key]').forEach(x=>x.addEventListener('change',()=>{if(x.checked)checkedKeys.add(x.dataset.sourceKey);else checkedKeys.delete(x.dataset.sourceKey);render();maybeSearch();}))}
function reportByKey(){let m={};for(const s of R.sources||[])m[s.source_key]=s;return m}
function renderStats(rs){let ok=(R.sources||[]).filter(s=>s.ok).length;$('stats').innerHTML=`<div class="stat"><b>${rs.length}</b><span>results</span></div><div class="stat"><b>${checkedKeys.size}</b><span>selected engines</span></div><div class="stat"><b>${ok}/${R.sources?.length||0}</b><span>engines ok</span></div><div class="stat"><b>${R.elapsed_ms||0}ms</b><span>last run</span></div>`}
function renderResults(){let rs=[...(R.results||[])];$('sub').textContent=lastQuery?`Live query: ${lastQuery}`:'Run a search to load live results.';$('results').innerHTML=rs.length?rs.map((r,i)=>`<article class="card"><h3><a href="${r.url}" target="_blank" rel="noopener">${i+1}. ${r.title||r.url}</a></h3><a class="url" href="${r.url}" target="_blank" rel="noopener">${r.url}</a><p class="snippet">${r.snippet||''}</p><div class="badges"><span class="badge">${(r.sources||[]).length} source(s)</span>${(r.sources||[]).map(s=>`<span class="badge">${s}</span>`).join('')}</div></article>`).join(''):'<div class="empty">No result matches the current filters yet.</div>'}
function renderSources(){let reports=reportByKey(),map=byKey();let keys=selectedKeys();let html=keys.map(k=>{let s=map[k],r=reports[k];if(!s)return'';if($('hideFailed').checked&&r&&!r.ok)return'';let status=r?`<span class="badge ${r.ok?'ok':'fail'}">${r.ok?'ok':'fail'}</span>`:'<span class="badge">selected</span>';let detail=r?(r.ok?`${r.results.length} result(s) · ${r.elapsed_ms}ms`:`${r.error||'temporarily unavailable'} · ${r.elapsed_ms||0}ms`):s.description;return `<article class="source"><div class="source-head"><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a><span class="kind">${(s.display_flags||[])[0]||''}</span></div><p>${detail}</p><div class="badges">${status}${(s.display_flags||[]).map(f=>`<span class="${bclass(f)}">${f}</span>`).join('')}</div></article>`}).join('');$('sources').innerHTML=html||'<div class="empty">No engines selected.</div>'}
function render(){renderIntent();renderEngineGroups();renderStats(R.results||[]);renderResults();renderSources()}
async function search(){let q=$('q').value.trim();if(!q){setStatus('Type a search query.',true);return}let sources=selectedKeys();if(!sources.length){setStatus('Choose at least one engine.',true);return}lastQuery=q;setStatus('Searching…');$('searchBtn').disabled=true;try{let url=new URL(API_BASE+'/search');url.searchParams.set('q',q);url.searchParams.set('mode',INTENTS[intent].apiMode);url.searchParams.set('sources',sources.join(','));url.searchParams.set('limitPerSource','3');url.searchParams.set('outputLimit','30');url.searchParams.set('timeout','8');let res=await fetch(url);let data=await res.json();if(!res.ok||!data.ok)throw new Error(data.error||res.statusText);R=data;setStatus(`Search complete: ${data.results.length} results, ${data.sources.filter(s=>s.ok).length}/${data.sources.length} engines ok.`);render()}catch(e){setStatus('Search error: '+e.message,true)}finally{$('searchBtn').disabled=false}}
async function init(){C=await fetch('/whipit/super-search/data/sources.json').then(r=>r.json());checkedKeys=new Set(recommendedKeys('general'));$('searchBtn').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});['hideFailed'].forEach(id=>$(id).addEventListener('change',render));render();}
init().catch(e=>{document.body.innerHTML='<pre>Failed to load Super Search UI: '+e+'</pre>'});
</script></body></html>
